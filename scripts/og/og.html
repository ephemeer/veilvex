<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Veilvex — OpenGraph cover (1200×630)</title>
    <!--
      Template for public/og.png. Rendered by scripts/og/render.mjs (npm run gen:og), which replaces
      the brand and the two taglines with the i18n content (ru/en hero.eyebrow) before the screenshot.
      Fonts: Inter Variable, self-hosted by @fontsource-variable/inter (latin + cyrillic subsets).
    -->
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url('../../node_modules/@fontsource-variable/inter/files/inter-cyrillic-wght-normal.woff2') format('woff2-variations');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        --bg: #08090a;
        --fg: #f7f8f8;
        --fg-2: #8a8f98;
        --lime: #c6ff4a;
        --line: rgba(255, 255, 255, 0.07);
        --line-2: rgba(255, 255, 255, 0.12);
        --pad: 88px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        font-feature-settings: 'cv11', 'ss01', 'ss03';
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }

      /* Linear-like blueprint grid, fading out towards the edges */
      .grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 64px 64px;
        background-position: 24px 22px;
        -webkit-mask-image: radial-gradient(ellipse 75% 85% at 62% 45%, #000 10%, transparent 72%);
        mask-image: radial-gradient(ellipse 75% 85% at 62% 45%, #000 10%, transparent 72%);
      }
      /* soft lime glow behind the wordmark + a cooler one bottom-right */
      .glow {
        position: absolute;
        width: 760px;
        height: 520px;
        left: -200px;
        top: -220px;
        background: radial-gradient(closest-side, rgba(198, 255, 74, 0.16), rgba(198, 255, 74, 0.05) 45%, transparent 100%);
      }
      .glow--2 {
        left: auto;
        top: auto;
        right: -260px;
        bottom: -300px;
        width: 820px;
        height: 620px;
        background: radial-gradient(closest-side, rgba(198, 255, 74, 0.1), transparent 100%);
      }
      /* horizontal hairlines, full width */
      .rule {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: var(--line-2);
      }
      .rule--top {
        top: 182px;
      }
      .rule--bottom {
        top: 526px;
      }
      /* big decorative V mark on the right */
      .vbig {
        position: absolute;
        right: -128px;
        top: 318px;
        width: 560px;
        height: 560px;
        fill: rgba(198, 255, 74, 0.03);
        stroke: rgba(198, 255, 74, 0.24);
        stroke-width: 0.3;
        stroke-linejoin: round;
      }

      .brand {
        position: absolute;
        left: var(--pad);
        top: 84px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand svg {
        width: 52px;
        height: 52px;
        fill: var(--lime);
        filter: drop-shadow(0 0 16px rgba(198, 255, 74, 0.45));
      }
      .brand span {
        font-size: 50px;
        font-weight: 640;
        letter-spacing: -0.035em;
        line-height: 1;
      }

      .accent {
        position: absolute;
        left: var(--pad);
        top: 254px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .accent i {
        display: block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--lime);
        box-shadow: 0 0 14px rgba(198, 255, 74, 0.8);
      }
      .accent b {
        display: block;
        width: 72px;
        height: 2px;
        background: linear-gradient(90deg, var(--lime), rgba(198, 255, 74, 0.1));
      }

      .tagline {
        position: absolute;
        left: var(--pad);
        top: 292px;
        margin: 0;
        display: grid;
        gap: 14px;
      }
      .tagline .ru {
        font-size: 66px;
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1.05;
        color: var(--fg);
        white-space: nowrap;
      }
      .tagline .en {
        font-size: 36px;
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1.2;
        color: var(--fg-2);
        white-space: nowrap;
      }

      .foot {
        position: absolute;
        left: var(--pad);
        top: 556px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg-2);
      }
      .foot i {
        display: block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--lime);
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <div class="glow glow--2" aria-hidden="true"></div>
    <div class="grid" aria-hidden="true"></div>
    <div class="rule rule--top" aria-hidden="true"></div>
    <div class="rule rule--bottom" aria-hidden="true"></div>
    <svg class="vbig" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.4 3.2h5.4L12 14l4.2-10.8h5.4L12 21.8z" /></svg>

    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.4 3.2h5.4L12 14l4.2-10.8h5.4L12 21.8z" /></svg>
      <span data-brand>Veilvex</span>
    </div>

    <div class="accent" aria-hidden="true"><i></i><b></b></div>

    <h1 class="tagline">
      <span class="ru" lang="ru" data-tagline-ru>Маркетинг в эпоху нейросетей</span>
      <span class="en" lang="en" data-tagline-en>Marketing in the age of AI</span>
    </h1>

    <div class="foot" aria-hidden="true"><i></i><span data-foot>GEO · SEO · Ads · Web · Apps · AI</span></div>
  </body>
</html>
